name: Build and deploy backend to Cloud Run

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  GCP_PROJECT: ${{ secrets.GCP_PROJECT }}
  GCP_REGION: ${{ secrets.GCP_REGION }}
  CLOUD_RUN_SERVICE: ${{ secrets.CLOUD_RUN_SERVICE }}
  ARTIFACT_REPO: ${{ secrets.ARTIFACT_REPO }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: ${{ env.GCP_PROJECT }}

      - name: Configure docker for Artifact Registry
        shell: bash
        run: |
          set -euo pipefail
          REGION="${{ env.GCP_REGION }}"
          # Region must be like "asia-south1" (no spaces, parentheses, etc.)
          if echo "$REGION" | grep -Eq '[^a-z0-9-]'; then
            echo "::error::Invalid GCP_REGION='$REGION'. Use only lowercase letters, numbers, and dashes (example: asia-south1)."
            exit 1
          fi
          REGISTRY_HOST="${REGION}-docker.pkg.dev"
          gcloud auth configure-docker "$REGISTRY_HOST" --quiet

      - name: Build and push container image
        run: |
          REPO=${{ env.ARTIFACT_REPO }}
          if [ -z "$REPO" ]; then REPO="bir"; fi
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${REPO}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.GCP_PROJECT }}

      - name: Deploy to Cloud Run
        run: |
          REPO=${{ env.ARTIFACT_REPO }}
          if [ -z "$REPO" ]; then REPO="bir"; fi
          IMAGE=${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT }}/${REPO}/${{ env.CLOUD_RUN_SERVICE }}:${{ github.sha }}
          gcloud run deploy ${{ env.CLOUD_RUN_SERVICE }} \
            --image $IMAGE \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.GCP_PROJECT }}
